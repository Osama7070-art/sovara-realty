name: Extract SOVARA REALTY

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o sovara-realty-fresh.zip -d .
          rm sovara-realty-fresh.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract SOVARA REALTY project [skip ci]" || exit 0
          git push
